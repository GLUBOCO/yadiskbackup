name: Build YaDiskBackup for macOS and Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch_name }})
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.3.17' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_name: Apple-Silicon-arm64
          - runner: macos-15-intel
            arch_name: Intel-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build app bundle
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name YaDiskBackup \
            --osx-bundle-identifier ru.glubo.yadiskbackup \
            YaDiskBackup_v2_3_17.py
          test -d dist/YaDiskBackup.app
          ditto -c -k --sequesterRsrc --keepParent dist/YaDiskBackup.app YaDiskBackup-macOS-${{ matrix.arch_name }}-${{ env.APP_VERSION }}.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaDiskBackup-macOS-${{ matrix.arch_name }}-${{ env.APP_VERSION }}
          path: YaDiskBackup-macOS-${{ matrix.arch_name }}-${{ env.APP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.3.17' }}
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --noconsole --onefile --name YaDiskBackup YaDiskBackup_v2_3_17.py

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaDiskBackup-Windows-${{ env.APP_VERSION }}
          path: dist/YaDiskBackup.exe
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Update existing GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: YaDiskBackup-*
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: ls -lah release-assets

      - name: Replace assets in existing release v2.3.17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.3.17
          gh release view v2.3.17 --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              YaDiskBackup.exe|YaDiskBackup-macOS-*)
                gh release delete-asset v2.3.17 "$asset" --yes
                ;;
            esac
          done
          gh release upload v2.3.17 release-assets/* --clobber
