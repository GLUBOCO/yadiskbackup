name: Build YaDiskBackup for macOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'YaDiskBackup_v2_3_15.py'
      - 'requirements.txt'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (${{ matrix.arch_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_name: Apple-Silicon-arm64
          - runner: macos-15-intel
            arch_name: Intel-x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build app bundle
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name YaDiskBackup \
            --osx-bundle-identifier ru.glubo.yadiskbackup \
            YaDiskBackup_v2_3_15.py

          test -d dist/YaDiskBackup.app

          ditto -c -k --sequesterRsrc --keepParent \
            dist/YaDiskBackup.app \
            "YaDiskBackup-macOS-${{ matrix.arch_name }}-v2.3.15.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaDiskBackup-macOS-${{ matrix.arch_name }}-v2.3.15
          path: YaDiskBackup-macOS-${{ matrix.arch_name }}-v2.3.15.zip
          if-no-files-found: error
          retention-days: 30
